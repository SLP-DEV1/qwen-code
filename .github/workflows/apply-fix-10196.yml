name: Apply fix for issue 10196

on:
  push:
    branches:
      - fix/10196-unresolved-write-redirects

permissions:
  contents: write

jobs:
  apply-fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Apply fix and regression tests
        shell: bash
        run: |
          python3 <<'PY'
          import base64
          from pathlib import Path

          def d(value: str) -> str:
              return base64.b64decode(value).decode()

          semantics = Path('packages/core/src/permissions/shell-semantics.ts')
          text = semantics.read_text()
          replacements = [
              ('ICBwYXRoTWF5RGVwZW5kT25Dd2Q/OiBib29sZWFuOwp9', 'ICBwYXRoTWF5RGVwZW5kT25Dd2Q/OiBib29sZWFuOwogIC8qKiBUcnVlIHdoZW4gc2hlbGwgc3ludGF4IHByb3ZlcyBhIHdyaXRlIG9jY3VycyBidXQgaXRzIHBhdGggY2Fubm90IGJlIHJlc29sdmVkIHN0YXRpY2FsbHkuICovCiAgcGF0aFVucmVzb2x2ZWQ/OiBib29sZWFuOwp9'),
              ('aW50ZXJmYWNlIFJlZGlyZWN0UmVzdWx0IHsKICByZWFkRmlsZXM6IHN0cmluZ1tdOwogIHdyaXRlRmlsZXM6IHN0cmluZ1tdOwp9', 'aW50ZXJmYWNlIFJlZGlyZWN0UmVzdWx0IHsKICByZWFkRmlsZXM6IHN0cmluZ1tdOwogIHdyaXRlRmlsZXM6IHN0cmluZ1tdOwogIHVucmVzb2x2ZWRXcml0ZTogYm9vbGVhbjsKfQ=='),
              ('ICBjb25zdCB7IHJlYWRGaWxlczogcmVkaXJlY3RSZWFkcywgd3JpdGVGaWxlczogcmVkaXJlY3RXcml0ZXMgfSA9CiAgICBleHRyYWN0UmVkaXJlY3RzKHRva2VucywgY3dkKTs=', 'ICBjb25zdCB7CiAgICByZWFkRmlsZXM6IHJlZGlyZWN0UmVhZHMsCiAgICB3cml0ZUZpbGVzOiByZWRpcmVjdFdyaXRlcywKICAgIHVucmVzb2x2ZWRXcml0ZSwKICB9ID0gZXh0cmFjdFJlZGlyZWN0cyh0b2tlbnMsIGN3ZCk7'),
              ('ICAgICAgLi4ucmVkaXJlY3RXcml0ZXMubWFwKChwKSA9PiAoewogICAgICAgIHZpcnR1YWxUb29sOiAnd3JpdGVfZmlsZScgYXMgY29uc3QsCiAgICAgICAgZmlsZVBhdGg6IHAsCiAgICAgIH0pKSwKICAgIF07', ''),
              ('ICAgIC4uLnJlZGlyZWN0V3JpdGVzLm1hcCgocCkgPT4gKHsKICAgICAgdmlydHVhbFRvb2w6ICd3cml0ZV9maWxlJyBhcyBjb25zdCwKICAgICAgZmlsZVBhdGg6IHAsCiAgICB9KSksCiAgKTs=', 'ICAgIC4uLnJlZGlyZWN0V3JpdGVzLm1hcCgocCkgPT4gKHsKICAgICAgdmlydHVhbFRvb2w6ICd3cml0ZV9maWxlJyBhcyBjb25zdCwKICAgICAgZmlsZVBhdGg6IHAsCiAgICB9KSksCiAgICAuLi4odW5yZXNvbHZlZFdyaXRlCiAgICAgID8gW3sgdmlydHVhbFRvb2w6ICd3cml0ZV9maWxlJyBhcyBjb25zdCwgcGF0aFVucmVzb2x2ZWQ6IHRydWUgfV0KICAgICAgOiBbXSksCiAgKTs='),
          ]
          for old64, new64 in replacements:
              old = d(old64)
              if old not in text:
                  raise SystemExit('required shell-semantics anchor not found')
              text = text.replace(old, d(new64), 1)

          start = text.find('function extractRedirects(tokens: string[], cwd: string): RedirectResult {')
          end_marker = '\n// ─────────────────────────────────────────────────────────────────────────────\n// Argument parsing'
          end = text.find(end_marker, start)
          if start < 0 or end < 0:
              raise SystemExit('extractRedirects boundaries not found')
          new_redirects = d('')
          text = text[:start] + new_redirects + text[end:]
          semantics.write_text(text)

          manager = Path('packages/core/src/permissions/permission-manager.ts')
          manager_text = manager.read_text()
          old = d('ICAgICAgICBvcC5jd2RVbmtub3duICYmCiAgICAgICAgb3AucGF0aE1heURlcGVuZE9uQ3dkICYmCg==')
          count = manager_text.count(old)
          if count != 3:
              raise SystemExit(f'expected 3 uncertain-path checks, found {count}')
          manager_text = manager_text.replace(old, d('ICAgICAgICAob3AucGF0aFVucmVzb2x2ZWQgfHwKICAgICAgICAgIChvcC5jd2RVbmtub3duICYmIG9wLnBhdGhNYXlEZXBlbmRPbkN3ZCkpICYmCg=='))
          manager.write_text(manager_text)

          Path('packages/core/src/permissions/dynamic-redirect-permissions.test.ts').write_text(d(''))
          PY

      - name: Install dependencies
        run: npm ci

      - name: Format changed files
        run: npx prettier --write packages/core/src/permissions/shell-semantics.ts packages/core/src/permissions/permission-manager.ts packages/core/src/permissions/dynamic-redirect-permissions.test.ts

      - name: Run focused tests
        run: npx vitest run packages/core/src/permissions/dynamic-redirect-permissions.test.ts packages/core/src/permissions/permission-manager.test.ts packages/core/src/permissions/shell-semantics.test.ts

      - name: Run preflight
        run: npm run preflight

      - name: Commit fix
        shell: bash
        run: |
          git config user.name "SLP-DEV1"
          git config user.email "298325363+SLP-DEV1@users.noreply.github.com"
          git rm .github/workflows/apply-fix-10196.yml
          git add packages/core/src/permissions/shell-semantics.ts packages/core/src/permissions/permission-manager.ts packages/core/src/permissions/dynamic-redirect-permissions.test.ts
          git commit -m "fix(permissions): fail closed on unresolved write redirects"
          git push origin HEAD
