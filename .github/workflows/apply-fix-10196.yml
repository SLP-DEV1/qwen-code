name: Apply fix for issue 10196

on:
  push:
    branches:
      - fix/10196-unresolved-write-redirects

permissions:
  contents: write

jobs:
  apply-fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Apply unresolved write redirect fix
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path

          p = Path('packages/core/src/permissions/shell-semantics.ts')
          s = p.read_text()

          s = s.replace(
              "  pathMayDependOnCwd?: boolean;\n}",
              "  pathMayDependOnCwd?: boolean;\n  /** True when a file path is known to be written but cannot be resolved statically. */\n  pathUnresolved?: boolean;\n}",
              1,
          )
          s = s.replace(
              "interface RedirectResult {\n  readFiles: string[];\n  writeFiles: string[];\n}",
              "interface RedirectResult {\n  readFiles: string[];\n  writeFiles: string[];\n  unresolvedWrite: boolean;\n}",
              1,
          )
          s = s.replace(
              "  const writeFiles: string[] = [];\n  const toRemove = new Set<number>();",
              "  const writeFiles: string[] = [];\n  let unresolvedWrite = false;\n  const toRemove = new Set<number>();",
              1,
          )

          # For separate-token write redirects, consume the redirect even when the
          # destination is dynamic and preserve a conservative unresolved-write signal.
          for op_group in [
              "tok === '>' || tok === '1>'",
              "tok === '>>' || tok === '1>>'",
          ]:
              marker = f"if ({op_group}) {{\n      const target = tokens[i + 1];\n      if (target && looksLikePath(target)) {{"
              replacement = f"if ({op_group}) {{\n      const target = tokens[i + 1];\n      if (target) {{\n        if (!looksLikePath(target)) unresolvedWrite = true;\n        if (looksLikePath(target)) {{"
              if marker not in s:
                  raise SystemExit(f'missing write redirect marker: {op_group}')
              s = s.replace(marker, replacement, 1)
              # Close the new inner path check immediately after the network-device block.
              needle = "          writeFiles.push(resolvePath(target, cwd));\n        }\n        toRemove.add(i);"
              repl = "          writeFiles.push(resolvePath(target, cwd));\n        }\n        }\n        toRemove.add(i);"
              if needle not in s:
                  raise SystemExit(f'missing write redirect close marker: {op_group}')
              s = s.replace(needle, repl, 1)

          stderr_old = """      if (target) {
        if (
          target !== '/dev/null' &&
          looksLikePath(target) &&
          !isNetworkPseudoDevice(target)
        ) {
          writeFiles.push(resolvePath(target, cwd));
        }
        toRemove.add(i);"""
          stderr_new = """      if (target) {
        if (
          target !== '/dev/null' &&
          !isNetworkPseudoDevice(target)
        ) {
          if (looksLikePath(target)) {
            writeFiles.push(resolvePath(target, cwd));
          } else if (!/^&(?:\\d+|-)$/.test(target)) {
            unresolvedWrite = true;
          }
        }
        toRemove.add(i);"""
          if stderr_old not in s:
              raise SystemExit('missing stderr redirect block')
          s = s.replace(stderr_old, stderr_new, 1)

          combined_old = """        if (
          target !== '/dev/null' &&
          looksLikePath(target) &&
          !isNetworkPseudoDevice(target)
        ) {
          if (op === '<') {
            readFiles.push(resolvePath(target, cwd));
          } else {
            writeFiles.push(resolvePath(target, cwd));
          }
        }
        toRemove.add(i);"""
          combined_new = """        if (
          target !== '/dev/null' &&
          !isNetworkPseudoDevice(target)
        ) {
          if (looksLikePath(target)) {
            if (op === '<') {
              readFiles.push(resolvePath(target, cwd));
            } else {
              writeFiles.push(resolvePath(target, cwd));
            }
          } else if (op !== '<' && !/^&(?:\\d+|-)$/.test(target)) {
            unresolvedWrite = true;
          }
        }
        toRemove.add(i);"""
          if combined_old not in s:
              raise SystemExit('missing combined redirect block')
          s = s.replace(combined_old, combined_new, 1)

          s = s.replace(
              "  return { readFiles, writeFiles };",
              "  return { readFiles, writeFiles, unresolvedWrite };",
              1,
          )
          old_destructure = "  const { readFiles: redirectReads, writeFiles: redirectWrites } =\n    extractRedirects(tokens, cwd);"
          new_destructure = "  const {\n    readFiles: redirectReads,\n    writeFiles: redirectWrites,\n    unresolvedWrite,\n  } = extractRedirects(tokens, cwd);"
          if old_destructure not in s:
              raise SystemExit('missing redirect destructure')
          s = s.replace(old_destructure, new_destructure, 1)

          no_cmd_old = """      ...redirectWrites.map((p) => ({
        virtualTool: 'write_file' as const,
        filePath: p,
      })),
    ];"""
          no_cmd_new = """      ...redirectWrites.map((p) => ({
        virtualTool: 'write_file' as const,
        filePath: p,
      })),
      ...(unresolvedWrite
        ? [{ virtualTool: 'write_file' as const, pathUnresolved: true }]
        : []),
    ];"""
          if no_cmd_old not in s:
              raise SystemExit('missing no-command redirect mapping')
          s = s.replace(no_cmd_old, no_cmd_new, 1)

          final_old = """    ...redirectWrites.map((p) => ({
      virtualTool: 'write_file' as const,
      filePath: p,
    })),
  );"""
          final_new = """    ...redirectWrites.map((p) => ({
      virtualTool: 'write_file' as const,
      filePath: p,
    })),
    ...(unresolvedWrite
      ? [{ virtualTool: 'write_file' as const, pathUnresolved: true }]
      : []),
  );"""
          if final_old not in s:
              raise SystemExit('missing final redirect mapping')
          s = s.replace(final_old, final_new, 1)
          p.write_text(s)

          p = Path('packages/core/src/permissions/permission-manager.ts')
          s = p.read_text()
          old = "        op.cwdUnknown &&\n        op.pathMayDependOnCwd &&\n"
          count = s.count(old)
          if count != 3:
              raise SystemExit(f'expected 3 uncertain-path checks, found {count}')
          s = s.replace(
              old,
              "        (op.pathUnresolved ||\n          (op.cwdUnknown && op.pathMayDependOnCwd)) &&\n",
          )
          p.write_text(s)
          PY

      - name: Add regression tests
        shell: bash
        run: |
          cat > packages/core/src/permissions/dynamic-redirect-permissions.test.ts <<'EOF'
          /**
           * @license
           * Copyright 2026 Qwen
           * SPDX-License-Identifier: Apache-2.0
           */

          import { describe, expect, it } from 'vitest';
          import { PermissionManager } from './permission-manager.js';
          import type { PermissionManagerConfig } from './permission-manager.js';
          import { extractShellOperations } from './shell-semantics.js';

          function makeConfig(options: { allow?: string[]; ask?: string[]; deny?: string[] }): PermissionManagerConfig {
            return {
              getPermissionsAllow: () => options.allow ?? [],
              getPermissionsAsk: () => options.ask ?? [],
              getPermissionsDeny: () => options.deny ?? [],
              getProjectRoot: () => '/repo',
              getCwd: () => '/repo',
              getApprovalMode: () => 'default',
            };
          }

          describe('unresolved shell write redirects (#10196)', () => {
            it.each([
              'printf PAYLOAD >"$PWD/protected.txt"',
              'printf PAYLOAD >"${PWD}/protected.txt"',
              'printf PAYLOAD >"$DIR/protected.txt"',
            ])('preserves an unresolved write operation for %s', (command) => {
              expect(extractShellOperations(command, '/repo')).toContainEqual({
                virtualTool: 'write_file',
                pathUnresolved: true,
              });
            });

            it('does not let a Bash allow bypass a Write deny through a dynamic redirect', async () => {
              const pm = new PermissionManager(makeConfig({
                allow: ['Bash(printf PAYLOAD)'],
                deny: ['WriteFileTool(protected.txt)'],
              }));
              pm.initialize();
              await expect(pm.evaluate({
                toolName: 'run_shell_command',
                command: 'printf PAYLOAD >"$PWD/protected.txt"',
                cwd: '/repo',
              })).resolves.toBe('ask');
            });

            it('still denies the equivalent concrete redirect', async () => {
              const pm = new PermissionManager(makeConfig({
                allow: ['Bash(printf PAYLOAD)'],
                deny: ['WriteFileTool(protected.txt)'],
              }));
              pm.initialize();
              await expect(pm.evaluate({
                toolName: 'run_shell_command',
                command: 'printf PAYLOAD >protected.txt',
                cwd: '/repo',
              })).resolves.toBe('deny');
            });

            it('keeps an ordinary Bash allow unchanged without a redirect', async () => {
              const pm = new PermissionManager(makeConfig({
                allow: ['Bash(printf PAYLOAD)'],
                deny: ['WriteFileTool(protected.txt)'],
              }));
              pm.initialize();
              await expect(pm.evaluate({
                toolName: 'run_shell_command',
                command: 'printf PAYLOAD',
                cwd: '/repo',
              })).resolves.toBe('allow');
            });
          });
          EOF

      - name: Install dependencies
        run: npm ci

      - name: Format changed files
        run: npx prettier --write packages/core/src/permissions/shell-semantics.ts packages/core/src/permissions/permission-manager.ts packages/core/src/permissions/dynamic-redirect-permissions.test.ts

      - name: Run focused tests
        run: npx vitest run packages/core/src/permissions/dynamic-redirect-permissions.test.ts packages/core/src/permissions/permission-manager.test.ts packages/core/src/permissions/shell-semantics.test.ts

      - name: Run preflight
        run: npm run preflight

      - name: Commit fix
        shell: bash
        run: |
          git config user.name "SLP-DEV1"
          git config user.email "298325363+SLP-DEV1@users.noreply.github.com"
          git rm .github/workflows/apply-fix-10196.yml
          git add packages/core/src/permissions/shell-semantics.ts packages/core/src/permissions/permission-manager.ts packages/core/src/permissions/dynamic-redirect-permissions.test.ts
          git commit -m "fix(permissions): fail closed on unresolved write redirects"
          git push origin HEAD
