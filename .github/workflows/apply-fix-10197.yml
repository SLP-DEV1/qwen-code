name: Apply fix for issue 10197

on:
  push:
    branches:
      - fix/10197-static-env-prefix-permissions

permissions:
  contents: write

jobs:
  apply-fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Apply static env-prefix permission fix and regressions
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path
          from textwrap import dedent

          source = Path('packages/core/src/permissions/rule-parser.ts')
          text = source.read_text()

          shell_quote_import = "import { parse } from 'shell-quote';\n"
          if shell_quote_import not in text:
              raise SystemExit('shell-quote import anchor not found')
          text = text.replace(shell_quote_import, '', 1)

          old_normalization = "  const normalizedCommand = stripLeadingVariableAssignments(command);\n"
          new_normalization = dedent('''\
            // Concrete Bash permission rules represent the command identity the user
            // explicitly trusted. Leading environment assignments can change runtime
            // and loader startup semantics, so they must remain part of that identity
            // instead of being stripped before permission matching (#10197).
            const normalizedCommand = command.trim();
          ''')
          if old_normalization not in text:
              raise SystemExit('normalizedCommand anchor not found')
          text = text.replace(old_normalization, new_normalization, 1)

          helper = dedent('''\
            const ENV_ASSIGNMENT_REGEX = /^[A-Za-z_][A-Za-z0-9_]*=/;

            function stripLeadingVariableAssignments(command: string): string {
              const trimmed = command.trim();
              if (!trimmed) {
                return trimmed;
              }

              try {
                const tokens: string[] = [];

                for (const token of parse(trimmed)) {
                  if (typeof token === 'string') {
                    tokens.push(token);
                  } else if (
                    token &&
                    typeof token === 'object' &&
                    'op' in token &&
                    typeof token.op === 'string'
                  ) {
                    tokens.push(token.op);
                  }
                }

                let firstCommandToken = 0;
                while (
                  firstCommandToken < tokens.length &&
                  ENV_ASSIGNMENT_REGEX.test(tokens[firstCommandToken]!)
                ) {
                  firstCommandToken++;
                }

                return tokens.slice(firstCommandToken).join(' ');
              } catch {
                return trimmed;
              }
            }

          ''')
          if helper not in text:
              raise SystemExit('env-assignment helper block not found')
          text = text.replace(helper, '', 1)
          source.write_text(text)

          test = Path('packages/core/src/permissions/static-env-assignment-permissions.test.ts')
          test.write_text(dedent('''\
            /**
             * @license
             * Copyright 2026 Qwen
             * SPDX-License-Identifier: Apache-2.0
             */

            import { describe, expect, it } from 'vitest';
            import { PermissionManager } from './permission-manager.js';
            import type { PermissionManagerConfig } from './permission-manager.js';
            import { matchesCommandPattern } from './rule-parser.js';

            function makeConfig(allow: string[]): PermissionManagerConfig {
              return {
                getPermissionsAllow: () => allow,
                getPermissionsAsk: () => [],
                getPermissionsDeny: () => [],
                getProjectRoot: () => '/repo',
                getCwd: () => '/repo',
                getApprovalMode: () => 'default',
              };
            }

            describe('static environment assignment permissions (#10197)', () => {
              it('still matches the exact concrete command', () => {
                expect(matchesCommandPattern('npm --version', 'npm --version')).toBe(
                  true,
                );
              });

              it.each([
                'FOO=bar npm --version',
                'NODE_OPTIONS=--require=/tmp/preload.cjs npm --version',
                'GIT_CONFIG_COUNT=1 GIT_CONFIG_KEY_0=core.fsmonitor GIT_CONFIG_VALUE_0=/tmp/fsmonitor.sh git status --short',
              ])(
                'does not let an unmentioned env prefix inherit a concrete allow rule: %s',
                (command) => {
                  const pattern = command.includes('git status')
                    ? 'git status --short'
                    : 'npm --version';
                  expect(matchesCommandPattern(pattern, command)).toBe(false);
                },
              );

              it('allows an env-prefixed command when the rule explicitly includes it', () => {
                const command =
                  'NODE_OPTIONS=--require=/tmp/preload.cjs npm --version';
                expect(matchesCommandPattern(command, command)).toBe(true);
              });

              it('keeps a broad Bash wildcard broad', () => {
                expect(
                  matchesCommandPattern(
                    '*',
                    'NODE_OPTIONS=--require=/tmp/preload.cjs npm --version',
                  ),
                ).toBe(true);
              });

              it('does not let a concrete Bash allow auto-approve a runtime-sensitive env prefix', async () => {
                const pm = new PermissionManager(
                  makeConfig(['Bash(npm --version)']),
                );
                pm.initialize();

                await expect(
                  pm.evaluate({
                    toolName: 'run_shell_command',
                    command:
                      'NODE_OPTIONS=--require=/tmp/preload.cjs npm --version',
                    cwd: '/repo',
                  }),
                ).resolves.toBe('ask');
              });

              it('still allows the exact saved concrete Bash command', async () => {
                const pm = new PermissionManager(
                  makeConfig(['Bash(npm --version)']),
                );
                pm.initialize();

                await expect(
                  pm.evaluate({
                    toolName: 'run_shell_command',
                    command: 'npm --version',
                    cwd: '/repo',
                  }),
                ).resolves.toBe('allow');
              });
            });
          '''))
          PY

      - name: Install dependencies
        run: npm ci

      - name: Format changed files
        run: npx prettier --write packages/core/src/permissions/rule-parser.ts packages/core/src/permissions/static-env-assignment-permissions.test.ts

      - name: Run focused tests
        run: npx vitest run packages/core/src/permissions/static-env-assignment-permissions.test.ts packages/core/src/permissions/permission-manager.test.ts

      - name: Run preflight
        run: npm run preflight

      - name: Commit fix
        shell: bash
        run: |
          git config user.name "SLP-DEV1"
          git config user.email "298325363+SLP-DEV1@users.noreply.github.com"
          git rm .github/workflows/apply-fix-10197.yml
          git add packages/core/src/permissions/rule-parser.ts packages/core/src/permissions/static-env-assignment-permissions.test.ts
          git commit -m "fix(permissions): require explicit env prefixes in Bash rules"
          git push origin HEAD
