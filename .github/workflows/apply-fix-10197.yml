name: Apply fix for issue 10197

on:
  push:
    branches:
      - fix/10197-static-env-prefix-permissions

permissions:
  contents: write

jobs:
  apply-fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Apply static env-prefix permission fix and regressions
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path
          from textwrap import dedent

          source = Path('packages/core/src/permissions/rule-parser.ts')
          text = source.read_text()

          old_normalization = "  const normalizedCommand = stripLeadingVariableAssignments(command);\n"
          new_normalization = dedent('''\
            // Preserve legacy leading-assignment normalization for wildcard rules,
            // whose scope is intentionally broad. Concrete rules must stay bound to
            // the exact command identity the user approved (#10197).
            const normalizedCommand = pattern.includes('*')
              ? stripLeadingVariableAssignments(command)
              : command.trim();
          ''')
          if old_normalization not in text:
              raise SystemExit('normalizedCommand anchor not found')
          text = text.replace(old_normalization, new_normalization, 1)
          source.write_text(text)

          test = Path('packages/core/src/permissions/static-env-assignment-permissions.test.ts')
          test.write_text(dedent('''\
            /**
             * @license
             * Copyright 2026 Qwen
             * SPDX-License-Identifier: Apache-2.0
             */

            import { describe, expect, it } from 'vitest';
            import { PermissionManager } from './permission-manager.js';
            import type { PermissionManagerConfig } from './permission-manager.js';
            import { matchesCommandPattern } from './rule-parser.js';

            function makeConfig(allow: string[]): PermissionManagerConfig {
              return {
                getPermissionsAllow: () => allow,
                getPermissionsAsk: () => [],
                getPermissionsDeny: () => [],
                getProjectRoot: () => '/repo',
                getCwd: () => '/repo',
                getApprovalMode: () => 'default',
              };
            }

            describe('static environment assignment permissions (#10197)', () => {
              it('still matches the exact concrete command', () => {
                expect(matchesCommandPattern('npm --version', 'npm --version')).toBe(true);
              });

              it.each([
                'FOO=bar npm --version',
                'NODE_OPTIONS=--require=/tmp/preload.cjs npm --version',
                'GIT_CONFIG_COUNT=1 GIT_CONFIG_KEY_0=core.fsmonitor GIT_CONFIG_VALUE_0=/tmp/fsmonitor.sh git status --short',
              ])(
                'does not let an unmentioned env prefix inherit a concrete allow rule: %s',
                (command) => {
                  const pattern = command.includes('git status')
                    ? 'git status --short'
                    : 'npm --version';
                  expect(matchesCommandPattern(pattern, command)).toBe(false);
                },
              );

              it('allows an env-prefixed command when the rule explicitly includes it', () => {
                const command = 'NODE_OPTIONS=--require=/tmp/preload.cjs npm --version';
                expect(matchesCommandPattern(command, command)).toBe(true);
              });

              it('preserves legacy env-prefix matching for explicit wildcard rules', () => {
                expect(
                  matchesCommandPattern(
                    'python3 *',
                    'PYTHONPATH=/tmp/lib python3 -c "print(1)"',
                  ),
                ).toBe(true);
                expect(
                  matchesCommandPattern(
                    '*',
                    'NODE_OPTIONS=--require=/tmp/preload.cjs npm --version',
                  ),
                ).toBe(true);
              });

              it('does not let a concrete Bash allow auto-approve a runtime-sensitive env prefix', async () => {
                const pm = new PermissionManager(makeConfig(['Bash(npm --version)']));
                pm.initialize();

                await expect(
                  pm.evaluate({
                    toolName: 'run_shell_command',
                    command: 'NODE_OPTIONS=--require=/tmp/preload.cjs npm --version',
                    cwd: '/repo',
                  }),
                ).resolves.toBe('ask');
              });

              it('still allows the exact saved concrete Bash command', async () => {
                const pm = new PermissionManager(makeConfig(['Bash(npm --version)']));
                pm.initialize();

                await expect(
                  pm.evaluate({
                    toolName: 'run_shell_command',
                    command: 'npm --version',
                    cwd: '/repo',
                  }),
                ).resolves.toBe('allow');
              });
            });
          '''))
          PY

      - name: Install dependencies
        run: npm ci

      - name: Format changed files
        run: npx prettier --write packages/core/src/permissions/rule-parser.ts packages/core/src/permissions/static-env-assignment-permissions.test.ts

      - name: Run focused tests
        run: npx vitest run packages/core/src/permissions/static-env-assignment-permissions.test.ts packages/core/src/permissions/permission-manager.test.ts

      - name: Run preflight
        run: npm run preflight

      - name: Commit fix
        shell: bash
        run: |
          git config user.name "SLP-DEV1"
          git config user.email "298325363+SLP-DEV1@users.noreply.github.com"
          git rm .github/workflows/apply-fix-10197.yml
          git add packages/core/src/permissions/rule-parser.ts packages/core/src/permissions/static-env-assignment-permissions.test.ts
          git commit -m "fix(permissions): require explicit env prefixes in concrete Bash rules"
          git push origin HEAD
