name: Validate and commit fix for issue 10196

on:
  push:
    branches:
      - fix/10196-unresolved-write-redirects

permissions:
  contents: write

jobs:
  apply-fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Apply source fix and tests
        shell: bash
        run: |
          echo ' isFdDuplicationTarget(target: string): boolean {
  return /^&(?:\d+|-)$/.test(target);
}

function isHeredocRedirectOperator(op: string): boolean {
  return /^(?:\d+)?<<-?$/.test(op);
}

function isWriteRedirectOperator(op: string): boolean {
  return /^(?:\d+)?(?:>>?|<>)$/.test(op) || op === '&>' || op === '&>>';
}

function isReadRedirectOperator(op: string): boolean {
  return /^(?:\d+)?<$/.test(op);
}

function extractRedirects(tokens: string[], cwd: string): RedirectResult {
  const readFiles: string[] = [];
  const writeFiles: string[] = [];
  const toRemove = new Set<number>();
  let unresolvedWrite = false;

  const recordWriteTarget = (target: string): void => {
    if (
      target === '/dev/null' ||
      isFdDuplicationTarget(target) ||
      isNetworkPseudoDevice(target)
    ) {
      return;
    }

    if (looksLikePath(target)) {
      writeFiles.push(resolvePath(target, cwd));
    } else {
      unresolvedWrite = true;
    }
  };

  const recordReadTarget = (target: string): void => {
    if (isFdDuplicationTarget(target) || isNetworkPseudoDevice(target)) {
      return;
    }
    if (looksLikePath(target)) {
      readFiles.push(resolvePath(target, cwd));
    }
  };

  for (let i = 0; i < tokens.length; i++) {
    const tok = tokens[i]!;

    if (isHeredocRedirectOperator(tok)) {
      toRemove.add(i);
      if (tokens[i + 1]) {
        toRemove.add(i + 1);
        i++;
      }
      continue;
    }

    if (isWriteRedirectOperator(tok)) {
      const target = tokens[i + 1];
      toRemove.add(i);
      if (target) {
        recordWriteTarget(target);
        toRemove.add(i + 1);
        i++;
      } else {
        unresolvedWrite = true;
      }
      continue;
    }

    if (isReadRedirectOperator(tok)) {
      const target = tokens[i + 1];
      toRemove.add(i);
      if (target) {
        recordReadTarget(target);
        toRemove.add(i + 1);
        i++;
      }
      continue;
    }

    const match = tok.match(
      /^((?:\d+)?<<-?|(?:\d+)?<>|(?:\d+)?>>|(?:\d+)?>|(?:\d+)?<|&>>|&>)(.+)$/,
    );
    if (!match) continue;

    const op = match[1]!;
    const target = match[2]!;
    if (isHeredocRedirectOperator(op)) {
      toRemove.add(i);
      continue;
    }
    if (isWriteRedirectOperator(op)) {
      recordWriteTarget(target);
    } else if (isReadRedirectOperator(op)) {
      recordReadTarget(target);
    }
    toRemove.add(i);
  }

  const filtered = tokens.filter((_, idx) => !toRemove.has(idx));
  tokens.length = 0;
  tokens.push(...filtered);

  return { readFiles, writeFiles, unresolvedWrite };
}
'''
text = text[:start] + new_redirects + text[end:]

replace_once(
    "  const { readFiles: redirectReads, writeFiles: redirectWrites } =\n    extractRedirects(tokens, cwd);",
    "  const {\n    readFiles: redirectReads,\n    writeFiles: redirectWrites,\n    unresolvedWrite,\n  } = extractRedirects(tokens, cwd);",
    "redirect destructure",
)

no_cmd_old = """      ...redirectWrites.map((p) => ({
        virtualTool: 'write_file' as const,
        filePath: p,
      })),
    ];"""
no_cmd_new = """      ...redirectWrites.map((p) => ({
        virtualTool: 'write_file' as const,
        filePath: p,
      })),
      ...(unresolvedWrite
        ? [{ virtualTool: 'write_file' as const, pathUnresolved: true }]
        : []),
    ];"""
replace_once(no_cmd_old, no_cmd_new, "no-command redirect ops")

final_old = """    ...redirectWrites.map((p) => ({
      virtualTool: 'write_file' as const,
      filePath: p,
    })),
  );"""
final_new = """    ...redirectWrites.map((p) => ({
      virtualTool: 'write_file' as const,
      filePath: p,
    })),
    ...(unresolvedWrite
      ? [{ virtualTool: 'write_file' as const, pathUnresolved: true }]
      : []),
