replace_once(final_old, final_new, "final redirect ops")
semantics.write_text(text)

manager = Path("packages/core/src/permissions/permission-manager.ts")
m = manager.read_text()
old = """        op.cwdUnknown &&
        op.pathMayDependOnCwd &&
"""
new = """        (op.pathUnresolved ||
          (op.cwdUnknown && op.pathMayDependOnCwd)) &&
"""
count = m.count(old)
if count != 1:
    raise SystemExit(f"expected exactly one uncertain-path escalation, found {count}")
m = m.replace(old, new, 1)
manager.write_text(m)

tests = Path("packages/core/src/permissions/dynamic-redirect-permissions.test.ts")
tests.write_text(r'''/**
 * @license
 * Copyright 2026 Qwen
 * SPDX-License-Identifier: Apache-2.0
 */

import { describe, expect, it } from 'vitest';
import { PermissionManager } from './permission-manager.js';
import type { PermissionManagerConfig } from './permission-manager.js';
import { extractShellOperations } from './shell-semantics.js';

function makeConfig(options: {
  allow?: string[];
  ask?: string[];
  deny?: string[];
}): PermissionManagerConfig {
  return {
    getPermissionsAllow: () => options.allow ?? [],
    getPermissionsAsk: () => options.ask ?? [],
    getPermissionsDeny: () => options.deny ?? [],
    getProjectRoot: () => '/repo',
    getCwd: () => '/repo',
    getApprovalMode: () => 'default',
  };
}

describe('unresolved shell write redirects (#10196)', () => {
  it.each([
    'printf PAYLOAD >"$PWD/protected.txt"',
    'printf PAYLOAD >"${PWD}/protected.txt"',
    'printf PAYLOAD >"$DIR/protected.txt"',
  ])('preserves an unresolved write operation for %s', (command) => {
    expect(extractShellOperations(command, '/repo')).toContainEqual({
      virtualTool: 'write_file',
      pathUnresolved: true,
    });
  });

  it('preserves a concrete write behind a numeric fd', () => {
    expect(
      extractShellOperations(
        'printf PAYLOAD 3>protected.txt >&3',
        '/repo',
      ),
    ).toContainEqual({
      virtualTool: 'write_file',
      filePath: '/repo/protected.txt',
    });
  });

  it('does not treat fd duplication as an unresolved filesystem write', () => {
    expect(
      extractShellOperations('printf PAYLOAD >&3', '/repo'),
    ).not.toContainEqual({
      virtualTool: 'write_file',
      pathUnresolved: true,
    });
  });

  it('does not let a Bash allow bypass a Write deny through a dynamic redirect', async () => {
    const pm = new PermissionManager(
      makeConfig({
        allow: ['Bash(printf PAYLOAD)'],
        deny: ['WriteFileTool(protected.txt)'],
      }),
    );
    pm.initialize();

    await expect(
      pm.evaluate({
        toolName: 'run_shell_command',
        command: 'printf PAYLOAD >"$PWD/protected.txt"',
        cwd: '/repo',
      }),
    ).resolves.toBe('ask');
  });

  it('still denies the equivalent concrete redirect', async () => {
    const pm = new PermissionManager(
      makeConfig({
        allow: ['Bash(printf PAYLOAD)'],
        deny: ['WriteFileTool(protected.txt)'],
      }),
    );
    pm.initialize();

    await expect(
      pm.evaluate({
        toolName: 'run_shell_command',
        command: 'printf PAYLOAD >protected.txt',
        cwd: '/repo',
      }),
    ).resolves.toBe('deny');
  });

  it('keeps an ordinary Bash allow unchanged without a redirect', async () => {
    const pm = new PermissionManager(
      makeConfig({
        allow: ['Bash(printf PAYLOAD)'],
        deny: ['WriteFileTool(protected.txt)'],
      }),
    );
    pm.initialize();

    await expect(
      pm.evaluate({
        toolName: 'run_shell_command',
        command: 'printf PAYLOAD',
        cwd: '/repo',
      }),
    ).resolves.toBe('allow');
  });
});
''')
