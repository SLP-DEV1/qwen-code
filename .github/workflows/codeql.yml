name: 'CodeQL'

on:
  push:
    branches: [main]
    paths: ['.github/workflows/codeql.yml']

permissions:
  contents: write

jobs:
  pr10212-hardening:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          fetch-depth: 0
      - name: Patch PR branch
        shell: bash
        run: |
          git show HEAD:.github/tmp/pr10212_fix.py > /tmp/pr10212_fix.py
          git fetch origin fix/10197-env-prefix-bash-rules
          git checkout -B fix/10197-env-prefix-bash-rules origin/fix/10197-env-prefix-bash-rules
          python3 /tmp/pr10212_fix.py
          git diff --check
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Focused tests and lint
        run: |
          npx vitest run packages/core/src/permissions/rule-parser.env-prefix.test.ts packages/core/src/permissions/permission-manager.test.ts
          npx eslint packages/core/src/permissions/rule-parser.ts packages/core/src/permissions/permission-manager.ts packages/core/src/permissions/rule-parser.env-prefix.test.ts --max-warnings 0
      - name: Push PR fix
        run: |
          git config user.name 'SLP-DEV1'
          git config user.email '298325363+SLP-DEV1@users.noreply.github.com'
          git add packages/core/src/permissions/rule-parser.ts packages/core/src/permissions/permission-manager.ts packages/core/src/permissions/rule-parser.env-prefix.test.ts
          git commit -m 'fix(permissions): match env prefixes by shell word'
          git push origin HEAD:fix/10197-env-prefix-bash-rules
